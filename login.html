<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>입주자 로그인 · 어반센터프라자</title>
<meta name="theme-color" content="#D98A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="ci-mark.jpg" type="image/jpeg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#FBF6ED;
  padding:1.5rem;
}

/* ── 래퍼 ── */
.login-card{
  background:#fff;
  border-radius:24px;
  padding:2.75rem 2rem;
  width:100%;max-width:380px;
  box-shadow:0 24px 60px -20px rgba(70,50,25,.35),0 0 0 1px rgba(0,0,0,.04);
}

/* ── 로고 영역 ── */
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo img{height:46px;display:block;margin:0 auto 14px;}
.login-logo-name{
  font-size:20px;font-weight:800;
  color:#3A3228;letter-spacing:-.01em;
}
.login-logo-sub{font-size:11px;color:#A99A82;letter-spacing:.15em;margin-top:5px;text-transform:uppercase;}
.login-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:#FDEEDB;color:#C07F2E;
  font-size:12px;font-weight:700;letter-spacing:.04em;
  padding:6px 14px;border-radius:999px;
  margin-top:12px;white-space:nowrap;
}

/* ── 폼 ── */
.login-label{display:block;font-size:12.5px;font-weight:700;color:#8A7C64;margin-bottom:6px;}
.login-input{
  width:100%;
  border:1.5px solid #EADFCB;
  border-radius:14px;
  padding:13px 15px;
  font-family:Pretendard,sans-serif;
  font-size:15px;color:#3A3228;
  background:#FBF6ED;
  outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
  margin-bottom:14px;
}
.login-input:focus{border-color:#D98A3D;background:#fff;box-shadow:0 0 0 3px rgba(217,138,61,.14);}
.login-btn{
  width:100%;
  background:linear-gradient(135deg,#E8A85A,#D98A3D);
  color:#fff;border:none;border-radius:15px;
  padding:15px;
  font-size:16px;font-weight:800;
  font-family:Pretendard,sans-serif;
  cursor:pointer;
  transition:filter .15s,transform .12s;
  margin-top:4px;
  box-shadow:0 10px 24px -10px rgba(217,138,61,.75);
}
.login-btn:hover{filter:brightness(1.05);}
.login-btn:active{transform:scale(.985);}
.login-btn:disabled{background:#C9BCA9;box-shadow:none;cursor:not-allowed;}

/* ── 에러 ── */
.login-err{
  display:none;
  font-size:13px;color:#C56A57;
  background:#F6E4E0;border:1px solid rgba(197,106,87,.25);
  border-radius:12px;padding:10px 13px;
  margin-bottom:14px;
}

/* ── 안내 ── */
.login-hint{
  margin-top:1.5rem;
  font-size:12.5px;color:#A99A82;
  text-align:center;line-height:1.8;
}
.login-hint a{color:#C07F2E;text-decoration:none;font-weight:700;}
.login-hint a:hover{text-decoration:underline;}

/* ── 하단 링크 ── */
.login-footer{
  margin-top:1.75rem;
  text-align:center;
  font-size:12px;color:#A99A82;
  display:flex;gap:12px;justify-content:center;align-items:center;
}
.login-footer a{color:#8A7C64;text-decoration:none;}
.login-footer a:hover{color:#C07F2E;}

/* 스피너 */
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{
  width:17px;height:17px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  display:inline-block;
  animation:spin .6s linear infinite;
  vertical-align:middle;margin-right:6px;
}
</style>
</head>
<body>

<div style="width:100%;max-width:360px;">
  <!-- 카드 -->
  <div class="login-card">
    <div class="login-logo">
      <img src="logo.png" alt="어반센터프라자">
      <div class="login-logo-name">어반센터프라자</div>
      <div class="login-logo-sub">URBAN CENTER PLAZA</div>
      <span class="login-badge"><i class="ph-fill ph-house" style="font-size:13px;"></i>입주자 로그인</span>
    </div>

    <div class="login-err" id="loginErr"></div>

    <div>
      <label class="login-label" for="loginRoom">호실 번호</label>
      <input type="text" class="login-input" id="loginRoom"
        placeholder="예) 101"
        maxlength="10" autocomplete="username"
        onkeydown="if(event.key==='Enter')document.getElementById('loginPw').focus()">

      <label class="login-label" for="loginPw">비밀번호</label>
      <input type="password" class="login-input" id="loginPw"
        placeholder="비밀번호 입력"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">

      <button class="login-btn" id="loginBtn" onclick="doLogin()">로그인</button>
    </div>

    <div class="login-hint">
      비밀번호를 잊으셨으면 관리사무소에 문의해 주세요.<br>
      <a href="tel:031-298-9086">☎ 031-298-9086</a>
    </div>
  </div>

  <!-- 하단 링크 -->
  <div class="login-footer">
    <a href="index.html">← 홈으로</a>
    <span style="color:#DAD2C4">·</span>
    <a id="privacyLink" href="#">개인정보처리방침</a>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsaSnMaAgCUSVDjLm9Ra1cr0aOFncN42M",
  authDomain: "urbancenterplaza.firebaseapp.com",
  projectId: "urbancenterplaza",
  storageBucket: "urbancenterplaza.firebasestorage.app",
  messagingSenderId: "171692889997",
  appId: "1:171692889997:web:333e87256d026387674fc4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DEFAULT_PW = '1111';

// 이미 로그인 상태면 index.html로 바로 이동
const existing = sessionStorage.getItem('ucp_resident');
if(existing) window.location.href = 'index.html';

window.doLogin = async function(){
  const roomRaw = document.getElementById('loginRoom').value.trim();
  const room    = roomRaw.replace(/호$/, '');
  const pw      = document.getElementById('loginPw').value;
  const err     = document.getElementById('loginErr');
  const btn     = document.getElementById('loginBtn');

  err.style.display = 'none';
  if(!room){ showErr('호실 번호를 입력해 주세요.'); return; }
  if(!pw){   showErr('비밀번호를 입력해 주세요.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>확인 중...';

  try {
    const snap = await getDoc(doc(db, 'resident_accounts', room));
    const storedPw = snap.exists() ? snap.data().password : DEFAULT_PW;

    if(pw !== storedPw){
      showErr('비밀번호가 올바르지 않습니다.');
      btn.disabled = false;
      btn.textContent = '로그인';
      return;
    }

    // 로그인 성공
    sessionStorage.setItem('ucp_resident', room);

    // 최초 로그인(계정 미생성)이면 기본 계정 생성
    if(!snap.exists()){
      await setDoc(doc(db, 'resident_accounts', room), {
        password: DEFAULT_PW, createdAt: new Date(), updatedAt: new Date()
      });
    }

    btn.textContent = '✓ 로그인 성공';
    // 돌아갈 페이지 확인 (returnTo 파라미터)
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('returnTo') || 'index.html';
    setTimeout(() => { window.location.href = returnTo; }, 400);

  } catch(e) {
    console.error('Login error:', e);
    if(e.code === 'permission-denied'){
      showErr('서버 권한 오류입니다. 관리사무소에 문의해 주세요.\n(Firebase Rules 설정 필요)');
    } else {
      showErr('로그인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    }
    btn.disabled = false;
    btn.textContent = '로그인';
  }
};

function showErr(msg){
  const err = document.getElementById('loginErr');
  err.textContent = msg;
  err.style.display = 'block';
}
</script>

</body>
</html>
